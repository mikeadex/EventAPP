services:
  postgres:
    image: postgres:16-alpine
    container_name: ekklesia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekklesia
      POSTGRES_PASSWORD: ekklesia
      POSTGRES_DB: ekklesia
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ekklesia']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ekklesia-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
