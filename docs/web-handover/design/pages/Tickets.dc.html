<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Ekklesia Events — Your tickets</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ekklesia.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alata&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.tk{display:grid;grid-template-columns:280px minmax(0,1fr) auto;align-items:stretch;overflow:hidden}
@media (max-width:760px){.tk{grid-template-columns:minmax(0,1fr)}.tk-media{height:180px}.tk-side{border-left:0!important;border-top:1px dashed var(--line-2)}}
</style>
</helmet>
<div class="{{ rootClass }}" style="display: flex; flex-direction: column;">
  <dc-import name="Header" theme="{{ theme }}" active="tickets" signed-in="{{ true }}" on-toggle="{{ toggleTheme }}" hint-size="100%,72px"></dc-import>

  <main class="wrap" style="flex: 1; padding-top: 48px; max-width: 1040px;">
    <div class="row-between" style="margin-bottom: 32px;">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <span class="eyebrow" style="color: var(--accent);">Tickets</span>
        <h1 class="h1">Your tickets</h1>
      </div>
      <div style="display: flex; gap: 8px;" role="tablist" aria-label="Ticket list">
        <button type="button" role="tab" class="{{ upCls }}" aria-selected="{{ isUp }}" onClick="{{ showUp }}">Upcoming · 2</button>
        <button type="button" role="tab" class="{{ pastCls }}" aria-selected="{{ isPast }}" onClick="{{ showPast }}">Past · 1</button>
      </div>
    </div>

    <ul style="display: flex; flex-direction: column; gap: 20px;">
      <sc-for list="{{ list }}" as="t" hint-placeholder-count="2">
        <li class="card card-link tk">
          <a href="Ticket.dc.html" class="tk-media" style="position: relative; display: block; min-height: 180px; background: var(--surface-2);" tabindex="-1" aria-hidden="true">
            <sc-if value="{{ t.image }}" hint-placeholder-val="{{ true }}">
              <img src="{{ t.image }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{ t.opacity }};">
            </sc-if>
          </a>
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 24px; min-width: 0;">
            <span class="eyebrow" style="color: var(--ink-2);">{{ t.when }}</span>
            <a href="Ticket.dc.html" style="font-size: 24px; line-height: 1.2; color: var(--strong);">{{ t.title }}</a>
            <span style="font-size: 15px; color: var(--muted);">{{ t.host }} · {{ t.venue }}</span>
            <span style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
              <span class="tag">{{ t.qty }}</span>
              <span class="tag" style="border-color: var(--line); color: var(--ink-2);">{{ t.price }}</span>
            </span>
          </div>
          <div class="tk-side" style="display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-width: 220px; padding: 24px; border-left: 1px dashed var(--line-2);">
            <span style="display: flex; flex-direction: column; gap: 6px;">
              <span class="eyebrow" style="font-size: 10px; color: var(--faint);">Ticket code</span>
              <span class="mono" style="font-size: 15px; letter-spacing: 0.08em;">{{ t.code }}</span>
              <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: {{ t.statusColor }};"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor;"></span>{{ t.status }}</span>
            </span>
            <a href="Ticket.dc.html" class="btn btn-primary">{{ t.cta }}</a>
          </div>
        </li>
      </sc-for>
    </ul>

    <p style="margin-top: 32px; font-size: 14px; color: var(--faint);">Tickets are also in the Ekklesia app and in your confirmation emails. <a href="Saved.dc.html" style="color: var(--accent);">See saved events →</a></p>
  </main>

  <div style="margin-top: 96px;">
    <dc-import name="Footer" theme="{{ theme }}" hint-size="100%,420px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1300}}'>
var UP = [
  { title: 'City Outreach Day', when: 'Sat 12 Dec at 09:00', host: 'Love Salvation Church', venue: 'Grace Hall', qty: '2 × Volunteer', price: 'Free', code: 'EK-CEMUDPNWLFM', status: 'Valid · active on the day', image: '../../assets/images/city-outreach.jpg' },
  { title: 'Alpha Course', when: 'Wed 13 Jan at 19:30', host: 'Grace Community', venue: 'Grace Community Centre', qty: '1 × Course place', price: 'Free', code: 'EK-6BB5LAGSL3G', status: 'Valid · active on the day', image: '../../assets/images/alpha-course.jpg' }
];
var PAST = [
  { title: 'Harvest Thanksgiving', when: 'Sun 4 Oct at 10:30', host: 'St Mark’s Greenwich', venue: 'St Mark’s Church', qty: '3 × General admission', price: 'Free', code: 'EK-H4RV3ST2026', status: 'Checked in · 4 Oct, 10:12', image: '' }
];
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var theme = s.theme || this.props.theme || 'dark';
    var tab = s.tab || 'up';
    var past = tab === 'past';
    var list = (past ? PAST : UP).map(function (t) {
      return Object.assign({}, t, {
        when: t.when.toUpperCase(),
        opacity: past ? 0.55 : 1,
        statusColor: past ? 'var(--muted)' : 'var(--accent)',
        cta: past ? 'View receipt' : 'View QR ticket'
      });
    });
    return {
      theme: theme,
      rootClass: 'ek t-' + theme,
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      isUp: !past, isPast: past,
      upCls: past ? 'chip' : 'chip on', pastCls: past ? 'chip on' : 'chip',
      showUp: () => this.setState({ tab: 'up' }), showPast: () => this.setState({ tab: 'past' }),
      list: list
    };
  }
}
</script>
</body>
</html>
