<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Event card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ekklesia.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alata&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<article class="{{ rootClass }}" style="display: flex; flex-direction: column; height: 100%; overflow: hidden; font-family: 'Alata', sans-serif;">
  <div style="position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--surface-2);">
    <a href="Event.dc.html" tabindex="-1" aria-hidden="true" style="position: absolute; inset: 0; display: block;">
      <sc-if value="{{ e.hasImage }}" hint-placeholder-val="{{ false }}">
        <img src="{{ e.image }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
      </sc-if>
      <sc-if value="{{ e.noImage }}" hint-placeholder-val="{{ true }}">
        <div class="cover-art" style="position: absolute; inset: 0; background: {{ e.art.bg }};">
          <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
            <g fill="none" stroke="{{ e.art.stroke }}" stroke-opacity="0.16">
              <circle cx="{{ e.art.cx }}" cy="{{ e.art.cy }}" r="40"></circle>
              <circle cx="{{ e.art.cx }}" cy="{{ e.art.cy }}" r="80"></circle>
              <circle cx="{{ e.art.cx }}" cy="{{ e.art.cy }}" r="120"></circle>
              <circle cx="{{ e.art.cx }}" cy="{{ e.art.cy }}" r="160"></circle>
              <circle cx="{{ e.art.cx }}" cy="{{ e.art.cy }}" r="200"></circle>
              <circle cx="{{ e.art.cx }}" cy="{{ e.art.cy }}" r="240"></circle>
            </g>
            <g stroke="{{ e.art.stroke }}" stroke-opacity="0.22" stroke-linecap="round" fill="none" transform="{{ e.art.transform }}">
              <path d="M18 50 H70" stroke-width="14"></path>
              <path d="M70 50 A26 26 0 1 0 58 71" stroke-width="14"></path>
              <path d="M76 62 V88" stroke-width="8"></path>
              <path d="M76 79 L88 68" stroke-width="8"></path>
              <path d="M76 79 L90 88" stroke-width="8"></path>
            </g>
          </svg>
        </div>
      </sc-if>
    </a>
    <div style="position: absolute; left: 14px; right: 14px; top: 14px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;">
      <span class="tag-solid">{{ e.category }}</span>
      <button type="button" class="icon-btn glass" onClick="{{ toggleSave }}" aria-pressed="{{ saved }}" aria-label="{{ saveLabel }}" style="pointer-events: auto; color: {{ heartColor }}; border-color: {{ heartBorder }};">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
      </button>
    </div>
  </div>
  <div style="display: flex; flex: 1; flex-direction: column; gap: 10px; padding: 20px;">
    <p class="eyebrow" style="color: var(--ink-2);">{{ e.when }}</p>
    <h3 style="font-size: 21px; line-height: 1.2; font-weight: 400; color: var(--strong);"><a href="Event.dc.html">{{ e.title }}</a></h3>
    <p style="font-size: 15px; color: var(--muted);">{{ e.hostName }}</p>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 12px; font-size: 14px;">
      <span style="color: var(--accent);">{{ e.price }}</span>
      <span style="color: var(--faint);">{{ e.going }}</span>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"event":{"editor":null},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":380,"height":430}}'>
var SAMPLE = {
  slug: 'charity-gala-dinner', title: 'Charity Gala Dinner', category: 'Fundraiser', hostName: 'Harvest Mission Trust',
  when: 'SAT 5 DEC AT 19:00', price: 'From £65', going: '182 going', image: '', hasImage: false, noImage: true,
  art: { bg: 'radial-gradient(120% 90% at 70% 20%, #7e1d14 0%, #2b0f0c 55%, #0d0a0b 100%)', stroke: '#ffb4a8', cx: 300, cy: 50, transform: 'translate(240 80) scale(1.6)' }
};
class Component extends DCLogic {
  renderVals() {
    var e = this.props.event || SAMPLE;
    var standalone = !this.props.event;
    var saved = !!(this.state && this.state.saved);
    return {
      e: e,
      rootClass: 'card card-link' + (standalone ? ' t-' + (this.props.theme || 'dark') : ''),
      saved: saved,
      saveLabel: (saved ? 'Remove ' : 'Save ') + e.title,
      heartFill: saved ? 'currentColor' : 'none',
      heartColor: saved ? 'var(--accent)' : 'var(--ink)',
      heartBorder: saved ? 'var(--line-3)' : 'var(--line-2)',
      toggleSave: () => this.setState({ saved: !saved })
    };
  }
}
</script>
</body>
</html>
